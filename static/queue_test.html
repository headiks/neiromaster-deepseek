<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка очередей — НейроМастер</title>
<style>
  body { font-family:'Segoe UI',Tahoma,sans-serif; max-width:1000px; margin:24px auto; padding:16px; background:#f5f7fa; color:#1e293b; }
  .head { display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #3b82f6; padding-bottom:10px; }
  h1 { font-size:22px; margin:0; }
  a.link,button.btn { border:1px solid #cbd5e1; border-radius:8px; padding:7px 13px; background:#fff; cursor:pointer; font-size:14px; text-decoration:none; color:#475569; font-family:inherit; }
  button.primary { background:#3b82f6; color:#fff; border-color:#3b82f6; }
  button:disabled { opacity:.6; cursor:default; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin:16px 0; }
  .stat { background:#fff; border-radius:10px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .stat .n { font-size:26px; font-weight:700; color:#1e40af; }
  .stat .l { font-size:12px; color:#64748b; text-transform:uppercase; letter-spacing:.03em; margin-top:2px; }
  .card { background:#fff; border-radius:10px; padding:16px; margin:12px 0; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  input[type=number] { width:80px; padding:7px 9px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid #e2e8f0; }
  th { color:#64748b; font-weight:600; font-size:12px; text-transform:uppercase; }
  .pill { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600; }
  .ok { background:#dcfce7; color:#166534; } .warn { background:#fef9c3; color:#854d0e; } .bad { background:#fee2e2; color:#991b1b; } .idle { background:#e2e8f0; color:#475569; }
  .muted { color:#94a3b8; font-size:13px; }
  pre { background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:10px; font-size:13px; white-space:pre-wrap; word-break:break-word; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle; }
</style>
</head>
<body>
  <div class="head">
    <h1>Проверка очередей</h1>
    <a class="link" href="/admin">← Админка</a>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <div id="redis-state" class="muted">Загрузка…</div>
      <label class="muted"><input type="checkbox" id="autoref" checked> автообновление (2с)</label>
    </div>
  </div>

  <div class="grid" id="stats"></div>

  <div class="card">
    <h3 style="margin:0 0 10px;">Воркеры</h3>
    <table id="workers"><thead><tr><th>Имя</th><th>Состояние</th><th>Текущая задача</th><th>Успешно</th><th>Ошибок</th></tr></thead><tbody></tbody></table>
    <div id="no-workers" class="muted" style="display:none;">Активных воркеров нет.</div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px;">Тест-задача</h3>
    <div class="muted" style="margin-bottom:10px;">Ставит безвредную задачу в очередь (ждёт N секунд и возвращает, какой воркер её выполнил). Проверяет цепочку web → Redis → worker.</div>
    <div class="row">
      <label>Длительность, сек: <input type="number" id="secs" value="2" min="0" max="30"></label>
      <button class="btn primary" id="enqueue-btn" onclick="enqueue()">Поставить в очередь</button>
    </div>
    <div id="job-out"></div>
  </div>

<script>
function api(u,o){return fetch(u,o).then(r=>{if(r.status===401){location.href='/login';throw new Error('401');}return r;});}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}

function statePill(s){
  const cls = s==='busy'||s==='started' ? 'warn' : (s==='idle' ? 'idle' : 'ok');
  return `<span class="pill ${cls}">${esc(s||'—')}</span>`;
}

async function refresh(){
  let d;
  try { d = await api('/api/queue/status').then(r=>r.json()); }
  catch(e){ return; }
  const rs = document.getElementById('redis-state');
  if(!d.redis){
    rs.innerHTML = `<span class="dot" style="background:#dc2626;"></span><b>Redis не подключён</b> — очередь в режиме потоков (один процесс). Воркеров/очереди нет.`;
    document.getElementById('stats').innerHTML =
      `<div class="stat"><div class="n">${esc(d.deepseek_in_flight)}/${esc(d.deepseek_max)}</div><div class="l">DeepSeek в полёте</div></div>`;
    document.getElementById('workers').querySelector('tbody').innerHTML='';
    document.getElementById('no-workers').style.display='block';
    return;
  }
  rs.innerHTML = `<span class="dot" style="background:#16a34a;"></span>Redis подключён · очередь <b>${esc(d.queue)}</b>`;
  document.getElementById('stats').innerHTML = [
    ['В очереди', d.queued, '#1e40af'],
    ['В работе', d.started, '#854d0e'],
    ['Выполнено', d.finished, '#166534'],
    ['Провалов', d.failed, d.failed>0?'#991b1b':'#1e40af'],
    ['Воркеров', d.worker_count, '#1e40af'],
    ['DeepSeek в полёте', `${d.deepseek_in_flight}/${d.deepseek_max}`, '#1e40af'],
  ].map(([l,n,c])=>`<div class="stat"><div class="n" style="color:${c}">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join('');

  const tb = document.getElementById('workers').querySelector('tbody');
  const ws = d.workers||[];
  document.getElementById('no-workers').style.display = ws.length?'none':'block';
  tb.innerHTML = ws.map(w=>`<tr>
    <td>${esc(w.name)}</td><td>${statePill(w.state)}</td>
    <td>${w.current_job?esc(w.current_job):'<span class="muted">—</span>'}</td>
    <td>${esc(w.successful ?? '—')}</td><td>${esc(w.failed ?? '—')}</td></tr>`).join('');
}

let watchTimer=null;
async function enqueue(){
  const btn=document.getElementById('enqueue-btn'); btn.disabled=true;
  const secs=parseFloat(document.getElementById('secs').value||'2');
  const out=document.getElementById('job-out');
  out.innerHTML='<div class="muted" style="margin-top:10px;">Ставлю задачу…</div>';
  try{
    const r=await api('/api/queue/selftest?seconds='+encodeURIComponent(secs),{method:'POST'});
    const d=await r.json();
    if(!r.ok) throw new Error(d.detail||'Ошибка');
    watchJob(d.job_id);
  }catch(e){
    out.innerHTML=`<pre class="bad">${esc(e.message)}</pre>`;
    btn.disabled=false;
  }
}

async function watchJob(id){
  const out=document.getElementById('job-out');
  const t0=Date.now();
  clearInterval(watchTimer);
  async function tick(){
    let j;
    try{ j=await api('/api/queue/job/'+encodeURIComponent(id)).then(r=>r.json()); }
    catch(e){ return; }
    const el=((Date.now()-t0)/1000).toFixed(1);
    const st=j.status;
    let html=`<div style="margin-top:10px;"><b>Задача</b> <code>${esc(id)}</code> — ${stateStatus(st)} <span class="muted">(${el}с)</span></div>`;
    if(st==='finished'){
      html+=`<pre class="ok">Выполнено воркером pid ${esc(j.result&&j.result.worker_pid)} в ${esc(j.result&&j.result.finished_at)}\nrezult: ${esc(JSON.stringify(j.result))}</pre>`;
      finish(html);
    } else if(st==='failed'){
      html+=`<pre class="bad">Провалено:\n${esc(j.exc||'')}</pre>`;
      finish(html);
    } else {
      out.innerHTML=html;
    }
  }
  function finish(html){ clearInterval(watchTimer); out.innerHTML=html; document.getElementById('enqueue-btn').disabled=false; }
  function stateStatus(s){
    const m={queued:['warn','в очереди'],started:['warn','выполняется'],finished:['ok','выполнено'],failed:['bad','провал'],deferred:['idle','отложена']};
    const [c,l]=m[s]||['idle',s]; return `<span class="pill ${c}">${esc(l)}</span>`;
  }
  tick();
  watchTimer=setInterval(tick,700);
}

let autoTimer=setInterval(()=>{ if(document.getElementById('autoref').checked) refresh(); },2000);
refresh();
</script>
<script src="/static/activity.js" defer></script>
</body>
</html>
